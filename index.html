<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Myanmar Quiz Game</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:20px;
}

.container{
background:white;
padding:20px;
border-radius:10px;
max-width:600px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
padding:12px 20px;
margin:10px;
border:none;
background:green;
color:white;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#answer{
margin-top:15px;
font-weight:bold;
color:#006600;
}

#progress{
color:#666;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Myanmar + English Quiz</h1>

<div id="progress"></div>

<h3 id="qno"></h3>

<p id="question"></p>

<button onclick="showAnswer()">Show Answer</button>

<p id="answer"></p>

<button onclick="nextQuestion()">Next Question</button>

</div>

<script>

const quiz = [

{q:"What is the capital of Myanmar?",a:"Naypyidaw"},
{q:"What is 5 + 5?",a:"10"},
{q:"What color is the sky?",a:"Blue"},
{q:"Which ocean is largest?",a:"Pacific Ocean"},
{q:"What is H2O?",a:"Water"},
{q:"Which country is famous for sushi?",a:"Japan"},
{q:"How many days are in a week?",a:"7"},
{q:"Which planet is called the Red Planet?",a:"Mars"},
{q:"What is 10 x 10?",a:"100"},
{q:"What is the national animal of Myanmar?",a:"Tiger"},

{q:"What is the largest planet?",a:"Jupiter"},
{q:"မြန်မာနိုင်ငံ၏ အရှည်ဆုံးမြစ်က ဘာလဲ?",a:"ဧရာဝတီမြစ်"},
{q:"Which country has the Eiffel Tower?",a:"France"},
{q:"1 Kilogram equals how many grams?",a:"1000"},
{q:"ကမ္ဘာ့အမြင့်ဆုံးတောင်က ဘာလဲ?",a:"Mount Everest"},
{q:"Who invented the telephone?",a:"Alexander Graham Bell"},
{q:"What is the currency of Japan?",a:"Yen"},
{q:"မြန်မာနိုင်ငံ လွတ်လပ်ရေးနေ့?",a:"January 4"},
{q:"Which planet is closest to the Sun?",a:"Mercury"},
{q:"Myanmar national flower?",a:"Padauk"},

{q:"How many continents are there?",a:"7"},
{q:"What is the capital of Thailand?",a:"Bangkok"},
{q:"မြန်မာနိုင်ငံ၏ အကြီးဆုံးမြို့?",a:"ရန်ကုန်"},
{q:"What is the boiling point of water?",a:"100°C"},
{q:"Which animal is known as King of the Jungle?",a:"Lion"},
{q:"What is the capital of South Korea?",a:"Seoul"},
{q:"Facebook was founded by?",a:"Mark Zuckerberg"},
{q:"What is 12 x 12?",a:"144"},
{q:"ကမ္ဘာပေါ်တွင် အကြီးဆုံးသမုဒ္ဒရာ?",a:"Pacific Ocean"},
{q:"Which country uses Dollar?",a:"United States"},

{q:"What is the capital of China?",a:"Beijing"},
{q:"Which gas do plants absorb?",a:"Carbon Dioxide"},
{q:"What is the fastest land animal?",a:"Cheetah"},
{q:"မြန်မာနိုင်ငံ၏ ငွေကြေး?",a:"Kyat"},
{q:"How many hours in a day?",a:"24"},
{q:"Which planet has rings?",a:"Saturn"},
{q:"Who wrote Romeo and Juliet?",a:"William Shakespeare"},
{q:"What is the largest mammal?",a:"Blue Whale"},
{q:"What is 100 ÷ 4?",a:"25"},
{q:"Which country is famous for pizza?",a:"Italy"},

{q:"What is the capital of India?",a:"New Delhi"},
{q:"Which bird cannot fly?",a:"Ostrich"},
{q:"What is the square root of 81?",a:"9"},
{q:"မြန်မာနိုင်ငံ၏ အမျိုးသားအားကစား?",a:"ချင်းလုံး"},
{q:"Which planet is known as Earth's twin?",a:"Venus"},
{q:"How many months are in a year?",a:"12"},
{q:"What is the capital of Australia?",a:"Canberra"},
{q:"Which metal is liquid at room temperature?",a:"Mercury"},
{q:"What is the largest desert in the world?",a:"Sahara Desert"},
{q:"Which country hosted the 2020 Olympics?",a:"Japan"}

];

let current = 0;

function loadQuestion(){
document.getElementById("progress").innerHTML =
"Question " + (current + 1) + " / " + quiz.length;

document.getElementById("qno").innerHTML =
"Question " + (current + 1);

document.getElementById("question").innerHTML =
quiz[current].q;

document.getElementById("answer").innerHTML = "";
}

function showAnswer(){
document.getElementById("answer").innerHTML =
"Answer: " + quiz[current].a;
}

function nextQuestion(){

current++;

if(current >= quiz.length){
alert("🎉 Quiz Finished!");
current = 0;
}

loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
